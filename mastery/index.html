<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Mastery Dashboard</title><style>:root{--n:#103e47;--t:#007f89;--c:#30c6cf;--l:#dcebed;--m:#667b80;--s:#e9f8f9;--w:#fff8e8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5fbfc;color:#17343a}a{text-decoration:none;color:inherit}.wrap{max-width:1050px;margin:auto;padding:0 22px}nav{height:66px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center}.nav{display:flex;gap:20px;align-items:center}.brand{font-weight:900;color:var(--t);font-size:22px;margin-right:auto}.hero{padding:55px 0 25px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--t)}h1{font-size:46px;letter-spacing:-.045em;margin:10px 0;color:var(--n)}.lead,.small{color:var(--m);line-height:1.6}.sync{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--l);padding:9px 11px;border-radius:99px;font-size:12px;color:var(--m)}.dot{width:8px;height:8px;border-radius:50%;background:#d6a62a}.dot.ok{background:#2e9b69}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px}.metric strong{font-size:34px;color:var(--n);display:block;margin:8px 0}.section{margin:30px 0}.section h2{color:var(--n);font-size:27px}.area{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:16px 0;border-top:1px solid var(--l)}.pill{font-size:11px;font-weight:850;padding:6px 9px;border-radius:99px;background:var(--s);color:var(--t)}.rec{background:var(--w);border:1px solid #f0dfb9;border-radius:18px;padding:20px}.btn{display:inline-block;background:var(--t);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;margin:8px 7px 0 0}.empty{text-align:center;padding:35px}.progress{height:9px;background:#e6f0f1;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--c))}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:38px}.nav a:not(.brand){display:none}}</style></head><body><nav><div class="wrap nav"><a class="brand" href="../">MEDUS</a><a href="../hoc/tiep-can-benh-nhan-sot/">Learn</a><a href="../qbank/">QBank</a><a href="../cases/">Cases</a><a href="../auth/">Account</a></div></nav><main class="wrap"><section class="hero"><div class="ey">MEDUS MASTERY · CLOUD BETA</div><h1>Năng lực của mày đang ở đâu?</h1><p class="lead">Dashboard ưu tiên dữ liệu Supabase theo tài khoản; nếu chưa đăng nhập mới dùng snapshot trên thiết bị.</p><div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Đang tải dữ liệu…</span></div></section><div id="app"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><script>const client=supabase.createClient(window.MEDUS_SUPABASE_URL,window.MEDUS_SUPABASE_PUBLISHABLE_KEY);function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}async function boot(){const{data}=await client.auth.getSession();const session=data.session;if(!session){syncText.innerHTML='Chưa đăng nhập · đang dùng dữ liệu thiết bị · <a href="../auth/" style="color:#007f89;font-weight:800">đăng nhập</a>';renderLocal();return}syncDot.classList.add('ok');syncText.textContent='Đã đăng nhập · đang đọc MEDUS Cloud';const[{data:m,error:me},{data:ca,error:ce}]=await Promise.all([client.from('mastery').select('*').eq('user_id',session.user.id).eq('clinical_problem_id',2),client.from('case_attempts').select('*').eq('user_id',session.user.id).eq('clinical_problem_id',2).order('created_at',{ascending:false}).limit(1)]);if(me||ce){syncText.textContent='Cloud chưa đọc được · đang dùng dữ liệu thiết bị';renderLocal();return}renderCloud(m||[],ca?.[0]||null)}function shell(correct,total,weak,compet,source,caseScore){if(!total){app.innerHTML='<div class="card empty"><h2>Chưa có dữ liệu Mastery</h2><p class="small">Làm QBank hoặc Clinical Case để tạo tín hiệu năng lực đầu tiên.</p><a class="btn" href="../qbank/">Bắt đầu QBank</a><a class="btn" href="../cases/">Làm Case</a></div>';return}let pct=Math.round(correct/total*100),level=pct>=85?'Đang vững':pct>=65?'Đang hình thành':'Cần củng cố',w=Object.entries(weak).sort((a,b)=>b[1]-a[1]),cp=Object.entries(compet).sort((a,b)=>b[1]-a[1]);app.innerHTML='<section class="grid"><div class="card metric"><div class="ey">OVERALL</div><strong>'+pct+'%</strong><span class="small">'+correct+'/'+total+' quyết định QBank đúng</span><div class="progress"><i style="width:'+pct+'%"></i></div></div><div class="card metric"><div class="ey">STATUS</div><strong>'+level+'</strong><span class="small">Clinical Problem 02 · Sốt</span></div><div class="card metric"><div class="ey">LATEST CASE</div><strong>'+(caseScore||'—')+'</strong><span class="small">Sepsis Gate · '+source+'</span></div></section><section class="section card"><div class="ey">KNOWLEDGE MAP</div><h2>Section cần ưu tiên</h2>'+(w.length?w.map(([x,n])=>'<div class="area"><span><b>'+x+'</b><span class="small" style="display:block">Clinical Problem 02 · Sốt</span></span><span class="pill">'+n+' tín hiệu yếu</span></div>').join(''):'<div class="area"><b>Chưa phát hiện weak section.</b><span class="pill">GOOD</span></div>')+'</section><section class="section card"><div class="ey">COMPETENCY MAP</div><h2>Năng lực cần củng cố</h2>'+(cp.length?cp.map(([x,n])=>'<div class="area"><span><b>'+x+'</b></span><span class="pill">'+n+' lỗi</span></div>').join(''):'<div class="area"><b>Chưa phát hiện competency yếu.</b><span class="pill">GOOD</span></div>')+'</section><section class="section rec"><div class="ey">NEXT BEST ACTION</div><h2 style="color:var(--n)">'+(w.length?'Ôn lại '+w[0][0]:'Tăng độ khó bằng ca lâm sàng')+'</h2><p class="small">MEDUS dùng attempt theo tài khoản để chọn phần nên học tiếp.</p><a class="btn" href="../hoc/tiep-can-benh-nhan-sot/">Mở bài học</a><a class="btn" href="../qbank/">Luyện QBank</a><a class="btn" href="../cases/">Làm Clinical Case</a></section>'}function renderCloud(m,c){let correct=m.reduce((n,x)=>n+(x.correct_count||0),0),total=m.reduce((n,x)=>n+(x.attempt_count||0),0),weak={},compet={};m.forEach(x=>{let misses=(x.attempt_count||0)-(x.correct_count||0);if(misses>0){weak[x.section_key]=(weak[x.section_key]||0)+misses;compet[x.competency]=(compet[x.competency]||0)+misses}});let cs=c?c.score+'/'+c.total:null;if(c?.details?.missed)c.details.missed.forEach(x=>weak[x.section]=(weak[x.section]||0)+1);syncText.textContent='✓ Mastery đang đọc từ MEDUS Cloud';shell(correct,total,weak,compet,'Supabase',cs)}function renderLocal(){let q=get('medus_mastery_fever'),c=get('medus_mastery_case_sepsis'),correct=q?q.score:0,total=q?q.total:0,weak={},compet={};[...(q?.missed||[]),...(c?.missed||[])].forEach(x=>{weak[x.section]=(weak[x.section]||0)+1;compet[x.competency]=(compet[x.competency]||0)+1});shell(correct,total,weak,compet,'thiết bị',c?c.score+'/'+c.total:null)}boot();</script></body></html>
