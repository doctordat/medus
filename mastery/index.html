<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MEDUS Mastery — tổng hợp QBank và Clinical Cases để chỉ ra phần kiến thức và năng lực cần ôn tiếp."><title>MEDUS Mastery Dashboard</title><style>:root{--n:#103e47;--t:#007f89;--c:#30c6cf;--l:#dcebed;--m:#667b80;--s:#e9f8f9;--w:#fff8e8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5fbfc;color:#17343a}a{text-decoration:none;color:inherit}.wrap{max-width:1050px;margin:auto;padding:0 22px}nav{height:66px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center}.nav{display:flex;gap:20px;align-items:center}.brand{font-weight:900;color:var(--t);font-size:22px;margin-right:auto}.hero{padding:55px 0 25px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--t)}h1{font-size:46px;letter-spacing:-.045em;margin:10px 0;color:var(--n)}.lead,.small{color:var(--m);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px}.metric strong{font-size:34px;color:var(--n);display:block;margin:8px 0}.section{margin:30px 0}.section h2{color:var(--n);font-size:27px;margin:7px 0 15px}.area{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:16px 0;border-top:1px solid var(--l)}.area:first-child{border-top:0}.area b{color:var(--n)}.pill{font-size:11px;font-weight:850;padding:6px 9px;border-radius:99px;background:var(--s);color:var(--t)}.rec{background:var(--w);border:1px solid #f0dfb9;border-radius:18px;padding:20px}.btn{display:inline-block;background:var(--t);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;margin:8px 7px 0 0}.empty{text-align:center;padding:35px}.progress{height:9px;background:#e6f0f1;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--c))}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:38px}.nav a:not(.brand){display:none}}</style></head><body><nav><div class="wrap nav"><a class="brand" href="../">MEDUS</a><a href="../hoc/tiep-can-benh-nhan-sot/">Learn</a><a href="../qbank/">QBank</a><a href="../cases/">Cases</a><a href="../mock/">Mock</a></div></nav><main class="wrap"><section class="hero"><div class="ey">MEDUS MASTERY · BETA</div><h1>Năng lực của mày đang ở đâu?</h1><p class="lead">Dashboard ghép dữ liệu từ QBank và Clinical Cases. Mục tiêu là trả lời ba câu: đang mạnh gì, yếu ở decision point nào, và nên học gì tiếp.</p></section><div id="app"></div></main><script>function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}const q=get('medus_mastery_fever'),c=get('medus_mastery_case_sepsis');function render(){if(!q&&!c){app.innerHTML='<div class="card empty"><h2>Chưa có dữ liệu Mastery</h2><p class="small">Làm starter QBank trước. Sau đó thử Clinical Case để MEDUS có hai loại tín hiệu năng lực.</p><a class="btn" href="../qbank/">Bắt đầu QBank</a></div>';return}let correct=(q?q.score:0)+(c?c.score:0),total=(q?q.total:0)+(c?c.total:0),pct=Math.round(correct/total*100),miss=[...(q?q.missed:[]),...(c?c.missed:[])],sec={},comp={};miss.forEach(x=>{sec[x.section]=(sec[x.section]||0)+1;comp[x.competency]=(comp[x.competency]||0)+1});let weak=Object.entries(sec).sort((a,b)=>b[1]-a[1]),compet=Object.entries(comp).sort((a,b)=>b[1]-a[1]);let level=pct>=85?'Đang vững':pct>=65?'Đang hình thành':'Cần củng cố';app.innerHTML='<section class="grid"><div class="card metric"><div class="ey">OVERALL</div><strong>'+pct+'%</strong><span class="small">'+correct+'/'+total+' quyết định đúng</span><div class="progress"><i style="width:'+pct+'%"></i></div></div><div class="card metric"><div class="ey">STATUS</div><strong>'+level+'</strong><span class="small">Clinical Problem 02 · Sốt</span></div><div class="card metric"><div class="ey">WEAK SIGNALS</div><strong>'+miss.length+'</strong><span class="small">lỗi được map về section/competency</span></div></section><section class="section card"><div class="ey">KNOWLEDGE MAP</div><h2>Section cần ưu tiên</h2>'+(weak.length?weak.map(([x,n])=>'<a class="area" href="../hoc/tiep-can-benh-nhan-sot/"><span><b>'+x+'</b><span class="small" style="display:block">Clinical Problem 02 · Sốt</span></span><span class="pill">'+n+' lỗi</span></a>').join(''):'<div class="area"><b>Chưa phát hiện weak section.</b><span class="pill">GOOD</span></div>')+'</section><section class="section card"><div class="ey">COMPETENCY MAP</div><h2>Năng lực cần củng cố</h2>'+(compet.length?compet.map(([x,n])=>'<div class="area"><span><b>'+x+'</b><span class="small" style="display:block">Tổng hợp từ QBank + Cases</span></span><span class="pill">'+n+' lỗi</span></div>').join(''):'<div class="area"><b>Starter data chưa phát hiện competency yếu.</b><span class="pill">GOOD</span></div>')+'</section><section class="section rec"><div class="ey">NEXT BEST ACTION</div><h2 style="margin:8px 0;color:var(--n)">'+(weak.length?'Ôn lại '+weak[0][0]:'Tăng độ khó bằng ca lâm sàng')+'</h2><p class="small">'+(weak.length?'Đây là section đang tạo nhiều lỗi nhất trong dữ liệu hiện có. MEDUS ưu tiên đưa mày về đúng phần này trước khi mở thêm câu tập trung.':'Starter set hiện ổn. Tiếp tục bằng case để kiểm tra reasoning theo chuỗi quyết định.')+'</p><a class="btn" href="../hoc/tiep-can-benh-nhan-sot/">Mở bài học</a><a class="btn" href="../qbank/">Luyện QBank</a><a class="btn" href="../cases/">Làm Clinical Case</a></section><p class="small" style="padding:20px 0 45px">Beta: dữ liệu hiện lưu trên thiết bị. Khi có account/backend, cùng schema này sẽ đồng bộ theo user và mở rộng qua 128 Clinical Problems.</p>'}render();</script></body></html>
