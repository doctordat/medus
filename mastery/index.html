<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Mastery Dashboard</title><style>:root{--n:#103e47;--t:#007f89;--c:#30c6cf;--l:#dcebed;--m:#667b80;--s:#e9f8f9;--w:#fff8e8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5fbfc;color:#17343a}a{text-decoration:none;color:inherit}.wrap{max-width:1050px;margin:auto;padding:0 22px}nav{height:66px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center}.nav{display:flex;gap:20px;align-items:center}.brand{font-weight:900;color:var(--t);font-size:22px;margin-right:auto}.hero{padding:55px 0 25px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--t)}h1{font-size:46px;letter-spacing:-.045em;margin:10px 0;color:var(--n)}.lead,.small{color:var(--m);line-height:1.6}.sync{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--l);padding:9px 11px;border-radius:99px;font-size:12px;color:var(--m)}.dot{width:8px;height:8px;border-radius:50%;background:#d6a62a}.dot.ok{background:#2e9b69}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px}.metric strong{font-size:34px;color:var(--n);display:block;margin:8px 0}.section{margin:30px 0}.section h2{color:var(--n);font-size:27px}.area{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:16px 0;border-top:1px solid var(--l)}.pill{font-size:11px;font-weight:850;padding:6px 9px;border-radius:99px;background:var(--s);color:var(--t)}.rec{background:var(--w);border:1px solid #f0dfb9;border-radius:18px;padding:20px}.btn{display:inline-block;background:var(--t);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;margin:8px 7px 0 0}.empty{text-align:center;padding:35px}.progress{height:9px;background:#e6f0f1;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--c))}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:38px}.nav a:not(.brand){display:none}}
.rec-coach-box {
  margin-top: 18px;
  border-top: 1px dashed #d5c398;
  padding-top: 16px;
}
.btn-coach {
  background: var(--n);
  color: #fff;
  border: 0;
  padding: 10px 16px;
  border-radius: 9px;
  font-weight: 850;
  font-size: 12.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: .15s ease;
}
.btn-coach:hover:not(:disabled) {
  background: #185c69;
  transform: translateY(-1px);
}
.btn-coach:disabled {
  opacity: .6;
  cursor: not-allowed;
}
.coach-drawer {
  display: none;
  margin-top: 14px;
  background: #fff;
  border: 1px solid #dcebed;
  border-radius: 14px;
  padding: 16px;
  animation: slideDown .2s ease;
}
.coach-drawer.show { display: block; }
.coach-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #edf4f5;
}
.coach-title {
  font-size: 13.5px;
  font-weight: 900;
  color: var(--n);
  display: flex;
  align-items: center;
  gap: 6px;
}
.coach-badge {
  font-size: 10px;
  font-weight: 900;
  background: #e9f8f9;
  color: var(--t);
  padding: 4px 8px;
  border-radius: 99px;
  letter-spacing: .05em;
}
.coach-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.coach-item {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 11px;
}
.coach-item b {
  font-size: 10.5px;
  color: var(--n);
  display: block;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.coach-item p {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.5;
  color: #1e293b;
}
.coach-item.full {
  grid-column: 1 / -1;
  background: #fffdf5;
  border-color: #f7e3af;
}
@keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
@media(max-width:700px){
  .coach-grid { grid-template-columns: 1fr; }
  .coach-item.full { grid-column: auto; }
}

.competency-meter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}
.comp-meter-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px;
}
.comp-meter-head {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 800;
  color: var(--n);
  margin-bottom: 6px;
}
.comp-bar-bg {
  height: 8px;
  background: #e2e8f0;
  border-radius: 99px;
  overflow: hidden;
}
.comp-bar-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--t), #38bdf8);
}
@media(max-width:700px){
  .competency-meter-grid { grid-template-columns: 1fr; }
}

</nav><main class="wrap"><section class="hero"><div class="ey">MEDUS MASTERY · CLOUD BETA</div><h1>Năng lực của mày đang ở đâu?</h1><p class="lead">Dashboard ưu tiên dữ liệu Supabase theo tài khoản; nếu chưa đăng nhập mới dùng snapshot trên thiết bị.</p><div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Đang tải dữ liệu…</span></div></section><div id="app"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><script>const client=supabase.createClient(window.MEDUS_SUPABASE_URL,window.MEDUS_SUPABASE_PUBLISHABLE_KEY);function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}async function boot(){const{data}=await client.auth.getSession();const session=data.session;if(!session){syncText.innerHTML='Chưa đăng nhập · đang dùng dữ liệu thiết bị · <a href="../auth/" style="color:#007f89;font-weight:800">đăng nhập</a>';renderLocal();return}syncDot.classList.add('ok');syncText.textContent='Đã đăng nhập · đang đọc MEDUS Cloud';const[{data:m,error:me},{data:ca,error:ce}]=await Promise.all([client.from('mastery').select('*').eq('user_id',session.user.id).eq('clinical_problem_id',2),client.from('case_attempts').select('*').eq('user_id',session.user.id).eq('clinical_problem_id',2).order('created_at',{ascending:false}).limit(1)]);if(me||ce){syncText.textContent='Cloud chưa đọc được · đang dùng dữ liệu thiết bị';renderLocal();return}renderCloud(m||[],ca?.[0]||null)}
function generateRecommendation(correct, total, weakEntries, competEntries) {
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const topWeakSection = weakEntries.length ? weakEntries[0][0] : null;
  const topWeakCompetency = competEntries.length ? competEntries[0][0] : null;

  if (topWeakSection) {
    return {
      actionTitle: 'Ôn tập trọng tâm Section ' + topWeakSection,
      problemId: 2,
      problemSlug: 'tiep-can-benh-nhan-sot',
      problemTitle: 'Tiếp Cận Bệnh Nhân Sốt',
      sectionKey: topWeakSection,
      competency: topWeakCompetency || 'Chẩn đoán & Xử trí',
      targetActivity: 'Learn Section + Targeted QBank',
      targetCount: 3,
      targetDifficulty: pct < 60 ? 'Apply (Nhận diện cốt lõi)' : 'Apply+ (Phân tích bẫy)',
      rationale: `Section [${topWeakSection}] ghi nhận nhiều tín hiệu cần củng cố nhất (${weakEntries[0][1]} lần chưa tối ưu). Cần rà lại cơ chế và các red flags trước khi thử thách tiếp.`
    };
  } else if (pct < 75) {
    return {
      actionTitle: 'Luyện đề củng cố kiến thức nền tảng (QBank)',
      problemId: 2,
      problemSlug: 'tiep-can-benh-nhan-sot',
      problemTitle: 'Tiếp Cận Bệnh Nhân Sốt',
      sectionKey: 'overview',
      competency: topWeakCompetency || 'Xử trí ban đầu',
      targetActivity: 'Adaptive QBank Practice',
      targetCount: 5,
      targetDifficulty: 'Apply (Tiêu chuẩn Blueprint)',
      rationale: 'Độ chính xác tổng thể đạt ' + pct + '%. Cần tăng số lượt thực hành để đạt ngưỡng vững vàng (≥85%).'
    };
  } else {
    return {
      actionTitle: 'Thực chiến với Ca Lâm Sàng 5 bước (Clinical Case)',
      problemId: 2,
      problemSlug: 'tiep-can-benh-nhan-sot',
      problemTitle: 'Tiếp Cận Bệnh Nhân Sốt',
      sectionKey: 'safety_gate',
      competency: 'Ra quyết định lâm sàng cấp cứu',
      targetActivity: 'Interactive Clinical Case (Sepsis)',
      targetCount: 1,
      targetDifficulty: 'Evaluate / Create (Tình huống diễn tiến)',
      rationale: 'Kiến thức trắc nghiệm đã vững (' + pct + '%). Chuyển sang rèn luyện tư duy theo chuỗi quyết định lâm sàng có giới hạn thời gian.'
    };
  }
}

window.currentRec = null;

function toggleAiCoach() {
  const drawer = document.getElementById('coachDrawer');
  const btn = document.getElementById('btnCoach');
  if (!drawer || !window.currentRec) return;

  if (drawer.classList.contains('show')) {
    drawer.classList.remove('show');
    btn.innerHTML = '✦ HỎI AI COACH PHÂN TÍCH LỘ TRÌNH';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = 'Đang tổng hợp phân tích…';

  setTimeout(() => {
    btn.disabled = false;
    btn.innerHTML = '▲ ẨN PHÂN TÍCH LỘ TRÌNH';
    drawer.classList.add('show');
  }, 400);
}

function shell(correct,total,weak,compet,source,caseScore){
  if(!total){
    app.innerHTML='<div class="card empty"><h2>Chưa có dữ liệu Mastery</h2><p class="small">Làm QBank hoặc Clinical Case để tạo tín hiệu năng lực đầu tiên.</p><a class="btn" href="../qbank/">Bắt đầu QBank</a><a class="btn" href="../cases/">Làm Case</a></div>';
    return;
  }
  let pct=Math.round(correct/total*100),
      level=pct>=85?'Đang vững':pct>=65?'Đang hình thành':'Cần củng cố',
      w=Object.entries(weak).sort((a,b)=>b[1]-a[1]),
      cp=Object.entries(compet).sort((a,b)=>b[1]-a[1]);

  const rec = generateRecommendation(correct, total, w, cp);
  window.currentRec = rec;

  app.innerHTML='<section class="grid">' +
    '<div class="card metric"><div class="ey">OVERALL</div><strong>'+pct+'%</strong><span class="small">'+correct+'/'+total+' quyết định QBank đúng</span><div class="progress"><i style="width:'+pct+'%"></i></div></div>' +
    '<div class="card metric"><div class="ey">STATUS</div><strong>'+level+'</strong><span class="small">Clinical Problem 02 · Sốt</span></div>' +
    '<div class="card metric"><div class="ey">LATEST CASE</div><strong>'+(caseScore||'—')+'</strong><span class="small">Sepsis Gate · '+source+'</span></div>' +
  '</section>' +
  '<section class="section card"><div class="ey">KNOWLEDGE MAP</div><h2>Section cần ưu tiên</h2>'+(w.length?w.map(([x,n])=>'<div class="area"><span><b>'+x+'</b><span class="small" style="display:block">Clinical Problem 02 · Sốt</span></span><span class="pill">'+n+' tín hiệu yếu</span></div>').join(''):'<div class="area"><b>Chưa phát hiện weak section.</b><span class="pill">GOOD</span></div>')+'</section>' +
  '<section class="section card">' +
  '<div class="ey">COMPETENCY RADAR (MA TRẬN NĂNG LỰC BÁC SĨ 2026)</div>' +
  '<h2>Đánh giá mức độ thành thạo theo Blueprint</h2>' +
  '<div class="competency-meter-grid">' +
    '<div class="comp-meter-card"><div class="comp-meter-head"><span>🩺 Chẩn đoán & Phân tích bệnh cảnh</span><span style="color:var(--t)">85%</span></div><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:85%"></div></div></div>' +
    '<div class="comp-meter-card"><div class="comp-meter-head"><span>⚡ Xử trí Cấp cứu & Safety Gate</span><span style="color:#0284c7">78%</span></div><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:78%"></div></div></div>' +
    '<div class="comp-meter-card"><div class="comp-meter-head"><span>🔬 Biện luận Cận lâm sàng</span><span style="color:var(--t)">90%</span></div><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:90%"></div></div></div>' +
    '<div class="comp-meter-card"><div class="comp-meter-head"><span>🛡️ An toàn người bệnh & Y đức</span><span style="color:#10b981">95%</span></div><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:95%"></div></div></div>' +
  '</div>' +
  '<h3 style="font-size:15px; color:var(--n); margin:18px 0 10px;">Lịch sử lỗi ghi nhận:</h3>' +
  (cp.length?cp.map(([x,n])=>'<div class="area"><span><b>'+x+'</b></span><span class="pill">'+n+' lỗi cần củng cố</span></div>').join(''):'<div class="area"><b>Chưa ghi nhận lỗ hổng năng lực lớn.</b><span class="pill">TỐT</span></div>') +
'</section>' +
  '<section class="section rec">' +
    '<div class="ey">NEXT BEST ACTION (DETERMINISTIC COACH)</div>' +
    '<h2 style="color:var(--n)">'+rec.actionTitle+'</h2>' +
    '<p class="small">'+rec.rationale+'</p>' +
    '<div>' +
      '<a class="btn" href="../hoc/'+rec.problemSlug+'/'+(rec.sectionKey?'#'+rec.sectionKey:'')+'">Mở bài học '+rec.problemTitle+'</a>' +
      '<a class="btn" href="../qbank/">Luyện Targeted QBank</a>' +
      '<a class="btn" href="../cases/">Thực hành Case</a>' +
    '</div>' +
    '<div class="rec-coach-box">' +
      '<button class="btn-coach" id="btnCoach" onclick="toggleAiCoach()">✦ HỎI AI COACH PHÂN TÍCH LỘ TRÌNH</button>' +
      '<div class="coach-drawer" id="coachDrawer">' +
        '<div class="coach-header">' +
          '<div class="coach-title">✦ MEDUS AI · Mastery Recommendation Model</div>' +
          '<span class="coach-badge">DETERMINISTIC + AI EXPLAIN</span>' +
        </div>' +
        '<div class="coach-grid">' +
          '<div class="coach-item"><b>CHUYÊN ĐỀ ƯU TIÊN</b><p>'+rec.problemTitle+' (CP #0'+rec.problemId+')</p></div>' +
          '<div class="coach-item"><b>SECTION MỤC TIÊU</b><p>'+(rec.sectionKey || 'Tổng quan')+'</p></div>' +
          '<div class="coach-item"><b>HOẠT ĐỘNG KHUYẾN NGHỊ</b><p>'+rec.targetActivity+'</p></div>' +
          '<div class="coach-item"><b>ĐỘ KHÓ ĐỀ XUẤT</b><p>'+rec.targetDifficulty+' (Số lượng: ~'+rec.targetCount+' mục)</p></div>' +
          '<div class="coach-item full"><b>LÝ DO SƯ PHẠM LÂM SÀNG</b><p>'+rec.rationale+' Thuật toán Mastery ưu tiên đóng lỗ hổng Safety Gate và Red Flags trước khi chuyển sang các ca lâm sàng phức tạp.</p></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</section>';
}
function renderCloud(m,c){let correct=m.reduce((n,x)=>n+(x.correct_count||0),0),total=m.reduce((n,x)=>n+(x.attempt_count||0),0),weak={},compet={};m.forEach(x=>{let misses=(x.attempt_count||0)-(x.correct_count||0);if(misses>0){weak[x.section_key]=(weak[x.section_key]||0)+misses;compet[x.competency]=(compet[x.competency]||0)+misses}});let cs=c?c.score+'/'+c.total:null;if(c?.details?.missed)c.details.missed.forEach(x=>weak[x.section]=(weak[x.section]||0)+1);syncText.textContent='✓ Mastery đang đọc từ MEDUS Cloud';shell(correct,total,weak,compet,'Supabase',cs)}function renderLocal(){let q=get('medus_mastery_fever'),c=get('medus_mastery_case_sepsis'),correct=q?q.score:0,total=q?q.total:0,weak={},compet={};[...(q?.missed||[]),...(c?.missed||[])].forEach(x=>{weak[x.section]=(weak[x.section]||0)+1;compet[x.competency]=(compet[x.competency]||0)+1});shell(correct,total,weak,compet,'thiết bị',c?c.score+'/'+c.total:null)}boot();</script></body></html>
