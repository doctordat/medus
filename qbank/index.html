<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS QBank — Starter 5 câu</title><style>:root{--n:#103e47;--t:#007f89;--l:#dcebed;--m:#667b80;--s:#e9f8f9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5fbfc;color:#17343a}a{text-decoration:none;color:inherit}.wrap{max-width:900px;margin:auto;padding:0 22px}nav{height:66px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center}.nav{display:flex;gap:20px;align-items:center}.brand{font-weight:900;color:var(--t);font-size:22px;margin-right:auto}.hero{padding:55px 0 24px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--t)}h1{font-size:44px;letter-spacing:-.04em;margin:10px 0;color:var(--n)}.lead{color:var(--m);line-height:1.65}.panel{background:#fff;border:1px solid var(--l);border-radius:22px;padding:26px;margin:20px 0 60px}.meta{font-size:12px;color:var(--m)}.q{font-size:21px;font-weight:800;line-height:1.5;margin:14px 0}.ans button{display:block;width:100%;text-align:left;border:1px solid var(--l);background:#fff;padding:14px;border-radius:11px;margin:9px 0;cursor:pointer}.ans button:hover{border-color:var(--t);background:var(--s)}.fb{display:none;margin-top:14px;padding:14px;border-radius:11px;background:var(--s);line-height:1.55}.result{text-align:center;display:none;padding:25px}.result strong{display:block;font-size:64px;color:var(--n)}.btn{display:inline-block;background:var(--t);color:#fff;border:0;padding:13px 17px;border-radius:11px;font-weight:800;cursor:pointer;margin-top:12px}.bar{height:8px;background:#e5eff0;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;background:var(--t);width:0}.foot{font-size:12px;color:var(--m);padding-bottom:40px}</style></head><body><nav><div class="wrap nav"><a class="brand" href="../">MEDUS</a><a href="../hoc/tiep-can-benh-nhan-sot/">Learn</a><a href="../cases/">Cases</a><a href="../mock/">Mock</a></div></nav><main class="wrap"><section class="hero"><div class="ey">MEDUS QBANK · FREE STARTER</div><h1>5 câu ứng dụng: bệnh nhân sốt</h1><p class="lead">Không kiểm tra nhớ máy móc. Mỗi câu hỏi tập trung vào ưu tiên lâm sàng và giải thích vì sao đáp án đúng/sai.</p></section><div class="panel"><div class="bar"><i id="bar"></i></div><div id="quiz"></div><div class="result" id="result"><span>Kết quả</span><strong id="score"></strong><p id="msg"></p><a class="btn" href="../hoc/tiep-can-benh-nhan-sot/">Ôn lại bài sốt</a> <a class="btn" href="../cases/">Thử ca lâm sàng</a></div></div><div class="foot">MEDUS Beta · Kết quả được lưu cục bộ trên thiết bị.</div></main><script>const d=[['Nam 68 tuổi sốt, HA 86/52, RR 30, SpO₂ 89%, lơ mơ, CRT 4 giây. Ưu tiên đầu tiên?',['CT ngực trước','ABCDE + hồi sức, đồng thời đánh giá sepsis','Chờ đủ xét nghiệm rồi xử trí','Hạ sốt trước'],1,'Bệnh nhân có nhiều dấu hiệu nguy kịch. Ưu tiên là ổn định ABCDE và xử trí song song, không chờ chẩn đoán hoàn chỉnh.'],['qSOFA = 0 ở bệnh nhân nghi nhiễm trùng. Kết luận phù hợp nhất?',['Loại trừ sepsis','Không cần đánh giá cơ quan','qSOFA không dùng để loại trừ sepsis','Có thể cho về ngay'],2,'qSOFA là tín hiệu nguy cơ tại giường, không phải test loại trừ sepsis.'],['Nữ 24 tuổi ngày 4 sốt, đau bụng tăng, Hct tăng, tiểu cầu giảm. Điều cần ưu tiên?',['Chỉ theo dõi nhiệt độ','Dùng NSAID','Đánh giá dengue dấu cảnh báo và tưới máu','Hết sốt là an toàn'],2,'Ngày bệnh, Hct động học và dấu cảnh báo quan trọng hơn việc nhiệt độ giảm.'],['Bệnh nhân hóa trị, sốt 38,5°C, ANC 0,2 ×10⁹/L, chưa thấy ổ.',['Chờ ổ nhiễm rõ','Sốt giảm bạch cầu là cấp cứu nhiễm trùng tiềm ẩn','Chỉ hạ sốt','Không cần cấy'],1,'Vật chủ giảm bạch cầu có thể ít dấu khu trú; cần đánh giá và khởi trị khẩn theo phác đồ.'],['Trước khi chỉ định một xét nghiệm ở bệnh nhân sốt, câu hỏi tốt nhất là gì?',['Xét nghiệm nào phổ biến nhất?','Panel nào đầy đủ nhất?','Kết quả này sẽ thay đổi xử trí nào?','Xét nghiệm nào nhạy nhất?'],2,'Một xét nghiệm có giá trị khi trả lời câu hỏi lâm sàng và có khả năng thay đổi quyết định.']];let i=0,s=0;const q=document.getElementById('quiz'),r=document.getElementById('result');function render(){bar.style.width=(i/d.length*100)+'%';if(i>=d.length){q.style.display='none';r.style.display='block';bar.style.width='100%';score.textContent=s+'/'+d.length;msg.textContent=s>=4?'Tốt. Tiếp theo thử ca Sepsis Gate để luyện dữ kiện mở dần.':'Nên xem lại Safety Gate, nhóm nguy cơ và nguyên tắc chọn xét nghiệm.';localStorage.setItem('medus_qbank_fever',s);return}let x=d[i];q.innerHTML='<div class="meta">Câu '+(i+1)+' / '+d.length+'</div><div class="q">'+x[0]+'</div><div class="ans">'+x[1].map((a,j)=>'<button onclick="pick('+j+')">'+String.fromCharCode(65+j)+'. '+a+'</button>').join('')+'</div><div class="fb" id="fb"></div>'}function pick(j){let x=d[i],f=document.getElementById('fb');f.style.display='block';f.innerHTML=(j===x[2]?'<b>Đúng.</b> ':'<b>Chưa đúng.</b> ')+x[3];if(j===x[2])s++;document.querySelectorAll('.ans button').forEach(b=>b.disabled=true);setTimeout(()=>{i++;render()},900)}render();</script></body></html>
