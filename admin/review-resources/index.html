<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Resource Review</title><style>body{font-family:system-ui;margin:0;background:#f5fbfc;color:#17343a}main{max-width:1200px;margin:auto;padding:24px}.notice{padding:14px;border:1px solid #eadcae;background:#fff8e8;border-radius:12px}.card{background:#fff;border:1px solid #dcebed;border-radius:15px;padding:16px;margin:14px 0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dcebed;text-align:left;font-size:13px}.pill{padding:4px 7px;border-radius:99px;background:#e9f8f9;color:#007f89;font-weight:800;font-size:11px}.bad{background:#fff0ed;color:#a34c43}@media(max-width:700px){table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main id="app" style="display:none"><p><a href="../">← MEDUS ADMIN</a></p><h1>Resource Review Queue</h1><div class="notice"><b>Read-only governance audit.</b> Không có nút Publish/Save. Kiểm tra provenance, image metadata, access và review status trước khi duyệt.</div><section class="card"><table><thead><tr><th>CP</th><th>Type/title</th><th>Access</th><th>Provenance</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-config.js"></script><script>const db=supabase.createClient(MEDUS_SUPABASE_URL,MEDUS_SUPABASE_PUBLISHABLE_KEY),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){let s=(await db.auth.getSession()).data.session;if(!s)return msg.textContent='Chưa đăng nhập.';let p=await db.from('profiles').select('role').eq('id',s.user.id).single();if(!p.data||!['editor','reviewer','admin'].includes(p.data.role))return msg.textContent='Không có quyền review.';app.style.display='block';let q=await db.from('clinical_problem_resources').select('clinical_problem_id,resource_type,title,url,alt_text,caption,attribution_license,source_locator,access_level,medical_review_status').order('updated_at',{ascending:false});if(q.error)return msg.textContent='Lỗi tải resources: '+q.error.message;rows.innerHTML=(q.data||[]).map(x=>{let issues=[];if(!x.attribution_license)issues.push('NO ATTRIBUTION');if(!x.source_locator)issues.push('NO LOCATOR');if(x.resource_type==='image'&&!x.alt_text)issues.push('NO ALT');return `<tr><td>CP ${x.clinical_problem_id}</td><td>${esc(x.resource_type)} · ${esc(x.title)}</td><td>${esc(x.access_level)}</td><td><span class="pill ${issues.length?'bad':''}">${esc(issues.join(' · ')||'PASS')}</span></td><td>${esc(x.medical_review_status)}</td></tr>`}).join('')||'<tr><td colspan="5">Resource queue đang rỗng.</td></tr>'}boot()</script></body></html>
