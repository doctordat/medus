<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Resources</title><style>body{font-family:system-ui;margin:0;background:#f5fbfc;color:#17343a}main{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dcebed;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid #cfe3e6;border-radius:8px;font:inherit}.field textarea{min-height:70px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#007f89;color:#fff;font-weight:800;cursor:pointer}.notice{background:#fff8e8;border:1px solid #eadcae;padding:12px;border-radius:10px}.preview img{max-width:260px;max-height:160px;display:block;margin-top:8px}.bad{color:#a34c43}.ok{color:#277a58}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main id="app" style="display:none"><p><a href="../">← MEDUS ADMIN</a></p><h1>Resource + Media Manifest</h1><div class="notice"><b>Resource Draft UI.</b> Save Draft ghi vào bảng Supabase mới; không có Publish. Validate và Export JSON để chờ Medical Review. Mỗi Clinical Problem cần tối thiểu một ảnh minh họa trước khi publish.</div><section class="card"><div class="grid"><label class="field">Clinical Problem<select id="cp"><option value="2">2 · Sốt</option><option value="3">3 · Đau ngực</option></select></label><label class="field">Resource type<select id="type"><option>image</option><option>youtube</option><option>pdf</option><option>external_link</option><option>internal_link</option><option>clinical_tool</option></select></label><label class="field">Title<input id="title"></label><label class="field">HTTPS URL / same-origin path<input id="url" placeholder="https://..."></label><label class="field">Alt text (bắt buộc cho image)<input id="alt"></label><label class="field">Caption<input id="caption"></label><label class="field">Attribution / license<input id="attrib"></label><label class="field">Source locator<input id="locator" placeholder="page/section/URL"></label><label class="field">Section key (optional)<input id="section" placeholder="safety_gate"></label><label class="field">Access level<select id="access"><option>public</option><option>free</option><option>premium</option></select></label></div><button class="btn" id="add">Add resource</button> <button class="btn" id="validate">Validate manifest</button> <button class="btn" id="export">Export Draft JSON</button><p id="msg"></p></section><section class="card"><h2>Draft resources</h2><div id="list">Chưa có resource.</div><div id="preview" class="preview"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-config.js"></script><script>const db=supabase.createClient(MEDUS_SUPABASE_URL,MEDUS_SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id),rows=[],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){const s=(await supabase.createClient(MEDUS_SUPABASE_URL,MEDUS_SUPABASE_PUBLISHABLE_KEY).auth.getSession()).data.session;if(!s){document.body.innerHTML='<main style="display:block"><h2>Chưa đăng nhập</h2></main>';return}const p=await supabase.createClient(MEDUS_SUPABASE_URL,MEDUS_SUPABASE_PUBLISHABLE_KEY).from('profiles').select('role').eq('id',s.user.id).single();if(!p.data||!['editor','reviewer','admin'].includes(p.data.role)){document.body.innerHTML='<main style="display:block"><h2>Không có quyền</h2></main>';return}$("app").style.display='block'}function safeUrl(v,type){try{let u=new URL(v,type==='internal_link'?location.href:undefined);if(type==='internal_link')return u.origin===location.origin&&u.pathname.startsWith('/medus/')?u.href:'';return u.protocol==='https:'?u.href:''}catch{return''}}function form(){return {clinical_problem_id:+$('cp').value,resource_type:$('type').value,title:$('title').value.trim(),url:$('url').value.trim(),alt_text:$('alt').value.trim(),caption:$('caption').value.trim(),attribution_license:$('attrib').value.trim(),source_locator:$('locator').value.trim(),section_key:$('section').value.trim()||null,access_level:$('access').value,status:'draft',medical_review_status:'draft'}}function validate(){let errs=[];for(let [i,r] of rows.entries()){if(!r.title)errs.push('#'+(i+1)+' thiếu title');if(!safeUrl(r.url,r.resource_type))errs.push('#'+(i+1)+' URL không hợp lệ');if(r.resource_type==='image'&&!r.alt_text)errs.push('#'+(i+1)+' image thiếu alt');if(!r.attribution_license)errs.push('#'+(i+1)+' thiếu attribution/license');if(!r.source_locator)errs.push('#'+(i+1)+' thiếu source locator')}for(let cp of [...$('cp').options].map(o=>+o.value))if(!rows.some(r=>r.clinical_problem_id===cp&&r.resource_type==='image'))errs.push('CP '+cp+' chưa có image resource');return errs}function render(){list.innerHTML=rows.length?rows.map((r,i)=>`<div><b>${i+1}. ${esc(r.title)}</b> · CP ${r.clinical_problem_id} · ${esc(r.resource_type)} · ${esc(r.status)}<br><small>${esc(r.url)}</small></div>`).join('<hr>'):'Chưa có resource.'}add.onclick=async()=>{let r=form();if(!r.title||!r.url)return msg.textContent='Cần title và URL.';if(!safeUrl(r.url,r.resource_type)||!r.attribution_license||!r.source_locator||(r.resource_type==='image'&&!r.alt_text))return msg.textContent='BLOCK: thiếu URL/provenance/alt.';if(!confirm('Lưu Resource Draft vào Supabase production? Chưa publish.'))return;let z=await db.from('clinical_problem_resources').insert(r).select().single();if(z.error)return msg.textContent='Lỗi lưu draft: '+z.error.message;rows.push(z.data);render();msg.textContent='✓ Đã lưu Resource Draft; chờ Medical Review.'};validate.onclick=()=>{let e=validate();msg.className=e.length?'bad':'ok';msg.textContent=e.length?'BLOCK: '+e.join(' · '):'PASS: manifest đủ provenance và mỗi CP có image.'};document.getElementById('export').onclick=()=>{let e=validate();if(e.length)return msg.textContent='Không export: '+e.join(' · ');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='medus-resources-draft.json';a.click();msg.textContent='Đã export draft JSON local.'};async function load(){let q=await db.from('clinical_problem_resources').select('*').order('created_at',{ascending:false});if(q.error){msg.textContent='Không tải được resources: '+q.error.message;return}rows.push(...(q.data||[]));render()}render();boot().then(load)</script></body></html>
