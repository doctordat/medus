<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS · Clinical Problems</title><style>:root{--n:#103e47;--t:#008b93;--l:#dcebed;--m:#667b80;--s:#e9f8f9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5fbfc;color:#17343a}header{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900;color:var(--t);font-size:20px}.wrap{max-width:980px;margin:auto;padding:32px 20px}.back{color:var(--t);text-decoration:none;font-weight:800}.hero h1{font-size:34px;margin:12px 0 5px;color:var(--n)}.small{font-size:12px;color:var(--m);line-height:1.55}.grid{display:grid;grid-template-columns:390px 1fr;gap:16px;margin-top:22px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:20px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:800}.field input,.field select{border:1px solid var(--l);border-radius:10px;padding:11px;font:inherit;background:#fff}.btn{border:0;background:var(--t);color:#fff;border-radius:10px;padding:12px 15px;font-weight:850;cursor:pointer;width:100%}.btn:disabled{opacity:.55}.row{padding:12px 0;border-bottom:1px solid #edf2f2}.row b{color:var(--n)}.pill{font-size:10px;font-weight:900;padding:4px 7px;border-radius:99px;background:var(--s);color:var(--t);margin-left:6px}.notice{padding:13px;border-radius:11px;background:var(--s);margin:12px 0}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">MEDUS ADMIN</div><div id="account" class="small">Đang xác thực…</div></header><main class="wrap"><a class="back" href="../">← Admin</a><div class="hero"><h1>Clinical Problems</h1><div class="small">Tạo vấn đề lâm sàng trước khi upload nguồn. Sau khi lưu, Clinical Problem sẽ xuất hiện trong dropdown Upload.</div></div><div id="gate" class="notice">Đang kiểm tra quyền…</div><div id="app" class="grid hidden"><section class="card"><h3>+ Thêm Clinical Problem</h3><div class="field"><label>STT / ID</label><input id="cpId" type="number" min="1" placeholder="Ví dụ: 1"></div><div class="field"><label>Tên Clinical Problem</label><input id="title" placeholder="Ví dụ: Đau ngực"></div><div class="field"><label>Slug</label><input id="slug" placeholder="dau-nguc"></div><div class="field"><label>Domain / nhóm</label><input id="domain" value="Clinical Medicine" placeholder="Ví dụ: Tim mạch"></div><div class="field"><label>Priority</label><input id="priority" type="number" value="0"></div><div class="field"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option></select></div><button id="save" class="btn">Lưu Clinical Problem</button><div id="msg" class="small" style="margin-top:10px"></div></section><section class="card"><h3>Clinical Problems hiện có</h3><div id="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-config.js"></script><script>const db=supabase.createClient(window.MEDUS_SUPABASE_URL,window.MEDUS_SUPABASE_PUBLISHABLE_KEY),$=x=>document.getElementById(x);let session;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function makeSlug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}async function load(){const{data,error}=await db.from('clinical_problems').select('*').order('id');if(error){$('list').innerHTML='<div class="small">'+esc(error.message)+'</div>';return}$('list').innerHTML=(data||[]).map(x=>'<div class="row"><b>'+x.id+' · '+esc(x.title)+'</b><span class="pill">'+esc(x.status)+'</span><div class="small">'+esc(x.slug)+' · '+esc(x.domain)+'</div></div>').join('')||'<div class="small">Chưa có Clinical Problem.</div>'}$('title').addEventListener('input',()=>{if(!$('slug').dataset.manual)$('slug').value=makeSlug($('title').value)});$('slug').addEventListener('input',()=>{$('slug').dataset.manual='1'});$('save').onclick=async()=>{let id=+$('cpId').value,title=$('title').value.trim(),slug=$('slug').value.trim()||makeSlug(title),domain=$('domain').value.trim()||'Clinical Medicine';if(!id||!title)return $('msg').textContent='Cần nhập STT và tên Clinical Problem.';$('save').disabled=true;$('msg').textContent='Đang lưu…';const payload={id,slug,title,domain,priority:+$('priority').value||0,status:$('status').value,updated_at:new Date().toISOString()};const{error}=await db.from('clinical_problems').insert(payload);$('save').disabled=false;if(error){$('msg').textContent='Không lưu được: '+error.message;return}$('msg').textContent='✓ Đã tạo '+id+' · '+title+'. Quay lại Admin → Sources / Upload để chọn.';$('cpId').value='';$('title').value='';$('slug').value='';delete $('slug').dataset.manual;await load()};async function boot(){const{data}=await db.auth.getSession();session=data.session;if(!session){$('gate').textContent='Chưa đăng nhập. Hãy đăng nhập MEDUS trước.';return}const{data:p}=await db.from('profiles').select('*').eq('id',session.user.id).single();$('account').textContent=(p?.display_name||session.user.email)+' · '+(p?.role||'');if(!p||!['editor','reviewer','admin'].includes(p.role)){$('gate').textContent='Tài khoản không có quyền Admin.';return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');await load()}boot();</script></body></html>
