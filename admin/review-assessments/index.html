<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Review · Cases & Quiz</title><style>body{font-family:system-ui;margin:0;background:#f5fbfc;color:#17343a}main{max-width:1200px;margin:auto;padding:24px}.notice{background:#fff8e8;border:1px solid #eadcae;padding:14px;border-radius:12px}.card{background:#fff;border:1px solid #dcebed;border-radius:14px;padding:16px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dcebed;text-align:left;font-size:13px}.pill{padding:4px 7px;border-radius:99px;background:#e9f8f9;color:#007f89;font-size:11px;font-weight:800}.bad{background:#fff0ed;color:#a34c43}@media(max-width:700px){table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main><p><a href="../">← MEDUS ADMIN</a></p><h1>Review Queue · Cases & Quiz</h1><div class="notice"><b>Review-only audit.</b> Trang này chưa có nút Publish. Kiểm tra source/provenance trước; status mutation cần migration và approval riêng.</div><section class="card"><h2>Quiz</h2><table><thead><tr><th>CP</th><th>Section</th><th>Question</th><th>Mapping</th><th>Status</th></tr></thead><tbody id="questions"></tbody></table></section><section class="card"><h2>Clinical Cases</h2><table><thead><tr><th>CP</th><th>Case</th><th>Steps</th><th>Source locator</th><th>Status</th></tr></thead><tbody id="cases"></tbody></table></section><p id="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-config.js"></script><script>const db=supabase.createClient(MEDUS_SUPABASE_URL,MEDUS_SUPABASE_PUBLISHABLE_KEY),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){let a=await db.auth.getSession(),session=a.data.session;if(!session)return msg.textContent='Chưa đăng nhập.';let p=await db.from('profiles').select('role').eq('id',session.user.id).single();if(!p.data||!['editor','reviewer','admin'].includes(p.data.role))return msg.textContent='Không có quyền review.';let q=await db.from('questions').select('id,clinical_problem_id,section_key,stem,competency,bloom,difficulty,source_title,source_locator,status').order('updated_at',{ascending:false});questions.innerHTML=(q.data||[]).map(x=>`<tr><td>CP ${x.clinical_problem_id}</td><td>${esc(x.section_key||'—')}</td><td>${esc((x.stem||'').slice(0,140))}</td><td>${esc([x.competency,x.bloom,x.difficulty,x.source_locator||'NO LOCATOR'].join(' · '))}</td><td><span class="pill ${x.source_locator?'':'bad'}">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Chưa có quiz.</td></tr>';let c=await db.from('cases').select('id,clinical_problem_id,title,summary,source_locator,status').order('updated_at',{ascending:false});let ids=(c.data||[]).map(x=>x.id),steps=ids.length?(await db.from('case_steps').select('case_id,step_order,section_key,competency').in('case_id',ids)).data||[]:[];cases.innerHTML=(c.data||[]).map(x=>{let ss=steps.filter(s=>s.case_id===x.id);return `<tr><td>CP ${x.clinical_problem_id}</td><td>${esc(x.title)}</td><td>${ss.length} · ${esc([...new Set(ss.map(s=>s.section_key).filter(Boolean))].join(', ')||'NO MAPPING')}</td><td><span class="pill bad">${esc(x.source_locator||'NO LOCATOR')}</span></td><td><span class="pill">${esc(x.status)}</span></td></tr>`}).join('')||'<tr><td colspan="5">Chưa có case.</td></tr>'}boot()</script></body></html>
