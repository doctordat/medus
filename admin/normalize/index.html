<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Normalize Engine v2.2</title><style>:root{--n:#103e47;--t:#007f89;--l:#dcebed;--m:#667b80;--s:#e9f8f9;--w:#fff8e8;--bad:#fff0ed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5fbfc;color:#17343a}header{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900;color:var(--t);text-decoration:none}main{max-width:1180px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:14px}h1{margin:4px 0;color:var(--n)}.small{font-size:12px;color:var(--m);line-height:1.55}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}.btn{border:0;background:var(--t);color:#fff;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.badge{font-size:10px;font-weight:900;padding:5px 7px;border-radius:99px;background:var(--s);color:var(--t)}select{width:100%;padding:11px;border:1px solid var(--l);border-radius:9px;margin:8px 0 14px}.row{padding:12px 0;border-bottom:1px solid #edf2f2}.warn{background:var(--w);padding:12px;border-radius:10px;margin:10px 0}.bad{background:var(--bad)}.preview{white-space:pre-wrap;font-size:12px;line-height:1.55;max-height:300px;overflow:auto;background:#f8fbfc;padding:12px;border-radius:10px}.score{font-size:22px;font-weight:900;color:var(--n)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../">← MEDUS ADMIN</a><span class="badge">NORMALIZE ENGINE v2.2</span></header><main><div class="card"><div class="small">INGESTION QUALITY GATE</div><h1>Normalize → Validate → Draft</h1><p class="small">v2.2: strict section boundaries + learner sanitization. Không kéo heading kế tiếp hoặc footer editorial vào Draft.</p></div><div id="gate" class="card">Đang xác thực…</div><div id="app" style="display:none"><div class="grid"><div class="card"><b>1 · Chọn source đã Extract</b><select id="source"></select><button class="btn" onclick="analyze()">Phân tích cấu trúc</button><div id="summary"></div></div><div class="card"><b>2 · Section candidates</b><div id="results" class="small">Chưa phân tích.</div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-config.js"></script><script>const db=supabase.createClient(window.MEDUS_SUPABASE_URL,window.MEDUS_SUPABASE_PUBLISHABLE_KEY);let session,sources=[],analysis=[];const defs=[['overview','Overview',['tổng quan','khái niệm','định nghĩa','definition']],['learning_objectives','Learning objectives',['mục tiêu học tập','mục tiêu','learning objectives']],['safety_gate','Safety Gate / Red flags',['cổng an toàn','dấu hiệu nguy','red flags','abcde','nguy kịch']],['mechanism','Mechanism / Pathophysiology',['sinh lý','sinh lý bệnh','cơ chế','pathophysiology']],['history','Targeted history',['khai thác bệnh sử','bệnh sử','hỏi bệnh','history']],['physical_exam','Physical exam',['khám lâm sàng','khám thực thể','physical exam']],['differential','Differential diagnosis',['chẩn đoán phân biệt','nguyên nhân','differential']],['investigations','Investigations',['cận lâm sàng','xét nghiệm','investigations']],['management','Initial management',['xử trí ban đầu','điều trị ban đầu','management']],['decision_points','Decision points',['điểm quyết định','decision points','quyết định lâm sàng']],['pitfalls','Pitfalls',['sai lầm','pitfalls','bẫy lâm sàng']],['clinical_pearls','Clinical pearls',['clinical pearls','điểm nhớ','pearls']],['checklist','Checklist',['checklist','bảng kiểm','tự kiểm']]];const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/\s+/g,' ').trim();const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function sanitize(t,key){let x=String(t||'').replace(/\r/g,'').replace(/MEDUS\s*[·•]\s*Draft first\s*[·•]\s*Medical Review before publish\.?/gi,'').trim();let d=defs.find(z=>z[0]===key);if(d){let names=[d[1],...d[2]].map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));x=x.replace(new RegExp('^\\s*(?:\\d{1,2}\\.\\s*)?(?:'+names.join('|')+')\\s*[:.-]?\\s*','i'),'')}const next=defs.map((d,i)=>({d,i})).find(z=>z.d[0]===key);if(next&&next.i<defs.length-1){let n=defs[next.i+1],names=[n[1],...n[2]].map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));let re=new RegExp('\\s+(?:'+(next.i+2)+'\\.\\s*)?(?:'+names.join('|')+')\\b','i'),m=x.search(re);if(m>0)x=x.slice(0,m)}x=x.replace(/\s+(?:1[0-3]|[1-9])\.\s*$/,'').trim();return x}function pageBlocks(text){return String(text||'').split(/--- PAGE \d+ ---/).map(x=>x.trim()).filter(Boolean)}function sentences(t){return t.match(/[^.!?•\n]+[.!?]?/g)||[t]}function headingScore(sentence,keys){let n=norm(sentence),score=0;for(let k of keys){let q=norm(k);if(n===q||n.startsWith(q+' '))score+=8;else if(n.includes(q))score+=2}if(sentence.length<120)score+=1;return score}function segment(text){let pages=pageBlocks(text),chunks=[];pages.forEach((p,pi)=>{let ss=sentences(p),start=0;for(let i=0;i<ss.length;i++){let best=null,bestScore=0;for(let d of defs){let sc=headingScore(ss[i],d[2]);if(sc>bestScore){best=d;bestScore=sc}}if(bestScore>=8){if(i>start)chunks.push({page:pi+1,text:ss.slice(start,i).join(' ').trim(),heading:null});start=i;let end=i+1;while(end<ss.length&&!defs.some(d=>headingScore(ss[end],d[2])>=8))end++;chunks.push({page:pi+1,text:ss.slice(i,end).join('\n').trim(),heading:best[0]});start=end;i=end-1}}if(start<ss.length)chunks.push({page:pi+1,text:ss.slice(start).join('\n').trim(),heading:null})});return chunks.filter(x=>x.text.length>30)}function classify(chunks){return defs.map(d=>{let direct=chunks.filter(c=>c.heading===d[0]);let pool=direct.length?direct:chunks.map(c=>({c,sc:d[2].reduce((a,k)=>a+(norm(c.text).includes(norm(k))?1:0),0)})).filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,2).map(x=>x.c);let text=sanitize(pool.map(x=>x.text).join('\n\n').trim(),d[0]),words=text.split(/\s+/).filter(Boolean).length;let foreign=defs.filter(o=>o[0]!==d[0]).filter(o=>o[2].some(k=>headingScore(text.slice(0,250),[k])>=8)).length;let quality=(direct.length?60:25)+Math.min(25,pool.length*10)+Math.min(15,words/40);if(foreign)quality-=foreign*25;if(words>900)quality-=25;if(words<25)quality-=25;quality=Math.max(0,Math.min(100,Math.round(quality)));return{key:d[0],title:d[1],text,pages:[...new Set(pool.map(x=>x.page))],quality,foreign,words,pass:quality>=65&&foreign===0&&words>=25&&words<=900}})}function analyze(){let x=sources.find(s=>s.id===source.value);if(!x)return;analysis=classify(segment(x.extracted_text));let pass=analysis.filter(a=>a.pass).length;summary.innerHTML='<div class="warn"><span class="score">'+pass+'/13</span><br>section vượt Quality Gate.<br><span class="small">Section không đạt sẽ không ghi database.</span></div><button class="btn" '+(!pass?'disabled':'')+' onclick="createDrafts()">Tạo '+pass+' Draft đạt chuẩn</button>';results.innerHTML=analysis.map(a=>'<div class="row '+(a.pass?'':'bad')+'"><div><b>'+esc(a.title)+'</b> <span class="badge">QUALITY '+a.quality+'</span> '+(a.pass?'<span class="badge">PASS</span>':'<span class="badge">BLOCKED</span>')+'</div><div class="small">'+a.words+' từ · page '+(a.pages.join(', ')||'—')+(a.foreign?' · contamination '+a.foreign:'')+'</div>'+(a.text?'<details><summary>Xem candidate</summary><div class="preview">'+esc(a.text.slice(0,4500))+'</div></details>':'<div class="small">Không tìm thấy candidate đủ tin cậy.</div>')+'</div>').join('')}async function createDrafts(){let x=sources.find(s=>s.id===source.value),good=analysis.filter(a=>a.pass);if(!x||!good.length)return;if(!confirm('Chỉ tạo '+good.length+' section PASS. Tiếp tục?'))return;let rows=good.map(a=>({clinical_problem_id:x.clinical_problem_id,section_key:a.key,title:a.title,content_md:a.text,medical_review_status:'draft',source_id:x.id,source_locator:'page '+a.pages.join(', '),updated_at:new Date().toISOString()}));let{error}=await db.from('content_sections').upsert(rows,{onConflict:'clinical_problem_id,section_key'});if(error)return alert('Không ghi Draft: '+error.message);await db.from('sources').update({status:'normalized',extraction_status:'normalized'}).eq('id',x.id);alert('Đã tạo '+rows.length+' Draft đạt Quality Gate. Hãy Review y khoa trước Publish.')}async function boot(){let{data}=await db.auth.getSession();session=data.session;if(!session)return gate.textContent='Chưa đăng nhập.';let{data:p}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(!p||!['editor','reviewer','admin'].includes(p.role))return gate.textContent='Không có quyền biên tập.';let{data:s,error}=await db.from('sources').select('*').not('extracted_text','is',null).order('created_at',{ascending:false});if(error)return gate.textContent='Không tải được source: '+error.message;sources=s||[];source.innerHTML=sources.map(x=>'<option value="'+x.id+'">CP '+x.clinical_problem_id+' · '+esc(x.source_title)+' · '+esc(x.extraction_status||'')+'</option>').join('');if(!sources.length)source.innerHTML='<option>Chưa có source có extracted text</option>';gate.style.display='none';app.style.display='block'}boot();</script></body></html>
