<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Admin · Case & Quiz Drafts</title><style>body{font-family:system-ui;margin:0;background:#f5fbfc;color:#17343a}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #dcebed;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field input,.field textarea,.field select{padding:10px;border:1px solid #cfe3e6;border-radius:9px;font:inherit}.field textarea{min-height:90px}.btn{background:#007f89;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#fff8e8}.step{border-left:4px solid #007f89;padding-left:12px;margin:12px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><p><a href="../">← MEDUS ADMIN</a></p><h1>Case & Quiz Authoring</h1><div class="notice"><b>Draft only.</b> Không có nút Publish tại đây. Mọi case/quiz phải qua Medical Review trước khi public. <strong>Lưu ý: Save Draft ghi trực tiếp vào Supabase project đang cấu hình; chỉ bấm sau khi đã xác nhận scope dữ liệu.</strong></div><section class="card"><h2>Quiz Draft</h2><div class="grid"><label class="field">Clinical Problem<select id="qCp"></select></label><label class="field">Section key<input id="qSection" placeholder="safety_gate"></label><label class="field">Competency<select id="qComp"><option>diagnosis</option><option>management</option><option>basic_science</option><option>practice_learning_improvement</option><option>communication_professionalism</option><option>systems_patient_safety</option></select></label><label class="field">Bloom<select id="qBloom"><option>apply</option><option>analyze</option><option>evaluate</option><option>create</option></select></label><label class="field">Difficulty<select id="qDiff"><option>easy</option><option>medium</option><option>hard</option></select></label><label class="field">Source locator<input id="qLocator" placeholder="page 3 / section"></label></div><label class="field">Stem<textarea id="qStem"></textarea></label><div class="grid"><label class="field">Option A<input id="qA"></label><label class="field">Option B<input id="qB"></label><label class="field">Option C<input id="qC"></label><label class="field">Option D<input id="qD"></label></div><label class="field">Correct option<select id="qCorrect"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><div class="grid"><label class="field">Explanation A<textarea id="qeA"></textarea></label><label class="field">Explanation B<textarea id="qeB"></textarea></label><label class="field">Explanation C<textarea id="qeC"></textarea></label><label class="field">Explanation D<textarea id="qeD"></textarea></label></div><button class="btn" id="saveQuiz">Save Quiz Draft</button><p id="qMsg"></p></section><section class="card"><h2>Progressive Clinical Case Draft</h2><div class="grid"><label class="field">Clinical Problem<select id="cCp"></select></label><label class="field">Case title<input id="cTitle"></label><label class="field">Source locator<input id="cLocator" placeholder="page/section"></label></div><label class="field">Summary<textarea id="cSummary"></textarea></label><div id="steps"></div><button class="btn" id="addStep">+ Add step</button> <button class="btn" id="saveCase">Save Case Draft</button><p id="cMsg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-config.js"></script><script>const db=supabase.createClient(MEDUS_SUPABASE_URL,MEDUS_SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);let session,problems=[],stepNo=0;const comps=['diagnosis','management','basic_science','practice_learning_improvement','communication_professionalism','systems_patient_safety'];function addStep(){if(stepNo>=5)return alert('Case tối đa 5 bước.');stepNo++;let d=document.createElement('div');d.className='step';d.innerHTML='<h3>Step '+stepNo+'</h3><label class="field">Prompt<textarea data-k="prompt"></textarea></label><label class="field">Options (JSON array)<input data-k="options" value="[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;]"></label><label class="field">Correct index<input data-k="correct_index" type="number" min="0" value="0"></label><label class="field">Section key<input data-k="section_key"></label><label class="field">Competency<select data-k="competency">'+comps.map(x=>'<option>'+x+'</option>').join('')+'</select></label><label class="field">Feedback<textarea data-k="feedback"></textarea></label>';d.dataset.step=stepNo;$('#steps').append(d)}async function boot(){let a=await db.auth.getSession();session=a.data.session;if(!session)return document.body.innerHTML='<main><h2>Chưa đăng nhập</h2><p><a href="../../auth/">Đăng nhập MEDUS</a></p></main>';let p=await db.from('profiles').select('role').eq('id',session.user.id).single();if(!p.data||!['editor','reviewer','admin'].includes(p.data.role))return document.body.innerHTML='<main><h2>Không có quyền</h2></main>';let r=await db.from('clinical_problems').select('id,title').order('id');problems=r.data||[];for(let id of ['qCp','cCp'])$(id).innerHTML=problems.map(x=>'<option value="'+x.id+'">'+x.id+' · '+x.title+'</option>').join('');addStep()}$('saveQuiz').onclick=async()=>{if(!confirm('Save Quiz Draft vào Supabase project đang cấu hình? Chưa publish.'))return;let v=id=>$(id).value.trim(),row={clinical_problem_id:+v('qCp'),section_key:v('qSection')||null,stem:v('qStem'),option_a:v('qA'),option_b:v('qB'),option_c:v('qC'),option_d:v('qD'),correct_option:v('qCorrect'),explanation_a:v('qeA'),explanation_b:v('qeB'),explanation_c:v('qeC'),explanation_d:v('qeD'),competency:v('qComp'),bloom:v('qBloom'),difficulty:v('qDiff'),source_locator:v('qLocator')||null,status:'draft'};if(!row.stem||[row.option_a,row.option_b,row.option_c,row.option_d].some(x=>!x)||!row.source_locator)return $('qMsg').textContent='Cần stem, đủ 4 options và source locator.';let r=await db.from('questions').insert(row);$('qMsg').textContent=r.error?'Lỗi: '+r.error.message:'✓ Đã lưu Quiz Draft (chưa review/publish).'};$('saveCase').onclick=async()=>{if(!confirm('Save Case Draft vào Supabase project đang cấu hình? Chưa publish.'))return;let v=id=>$(id).value.trim(),cards=[...document.querySelectorAll('.step')];if(cards.length<3)return $('cMsg').textContent='Case cần tối thiểu 3 bước.';let row={clinical_problem_id:+v('cCp'),title:v('cTitle'),summary:v('cSummary'),status:'draft'};if(!row.title||!v('cLocator'))return $('cMsg').textContent='Cần title và source locator.';let r=await db.from('cases').insert(row).select('id').single();if(r.error)return $('cMsg').textContent='Lỗi case: '+r.error.message;let steps=[];for(let [i,c] of cards.entries()){let g=k=>c.querySelector('[data-k="'+k+'"]').value.trim();let options;try{options=JSON.parse(g('options'))}catch{return $('cMsg').textContent='Options step '+(i+1)+' phải là JSON array.'}if(!g('prompt')||!Array.isArray(options)||options.length<2)return $('cMsg').textContent='Step '+(i+1)+' thiếu prompt/options.';steps.push({case_id:r.data.id,step_order:i+1,section_key:g('section_key')||null,competency:g('competency'),prompt:g('prompt'),options,correct_index:+g('correct_index'),feedback:g('feedback')})}let s=await db.from('case_steps').insert(steps);$('cMsg').textContent=s.error?'Lỗi steps: '+s.error.message:'✓ Đã lưu Case Draft '+r.data.id+' (chưa review/publish).'};boot()</script></body></html>
