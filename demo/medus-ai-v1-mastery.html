<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEDUS AI V1.2 — Mastery Coach Demo</title>
  <style>
    :root {
      --navy: #092c35;
      --navy-light: #104350;
      --teal: #008d98;
      --bg: #f5fafb;
      --ink: #163238;
      --muted: #6b868e;
      --line: #dbe8ea;
      --s: #e9f8f9;
      --w: #fff8e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap {
      max-width: 980px;
      margin: auto;
      padding: 24px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand {
      font-size: 22px;
      font-weight: 950;
      color: var(--navy);
    }
    .badge {
      font-size: 11px;
      font-weight: 900;
      background: #e6fffb;
      color: #006d75;
      border-radius: 999px;
      padding: 6px 12px;
      letter-spacing: .05em;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(9,44,53,.04);
    }
    .ey {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      color: var(--teal);
      text-transform: uppercase;
    }
    .metric strong {
      font-size: 34px;
      color: var(--navy);
      display: block;
      margin: 6px 0;
      font-weight: 950;
    }
    .small {
      color: var(--muted);
      font-size: 12.5px;
    }
    .progress {
      height: 7px;
      background: #e6f0f1;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--teal), #30c6cf);
    }
    .rec {
      background: var(--w);
      border: 1px solid #f0dfb9;
      border-radius: 18px;
      padding: 24px;
      margin-top: 20px;
    }
    .rec h2 {
      color: var(--navy);
      font-size: 24px;
      margin: 6px 0 8px;
      font-weight: 950;
    }
    .btn {
      display: inline-block;
      background: var(--teal);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 850;
      font-size: 13px;
      text-decoration: none;
      margin: 12px 8px 0 0;
    }
    .btn:hover { opacity: .9; }
    .rec-coach-box {
      margin-top: 20px;
      border-top: 1px dashed #d5c398;
      padding-top: 16px;
    }
    .btn-coach {
      background: var(--navy);
      color: #fff;
      border: 0;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 850;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-coach:hover { background: var(--navy-light); }
    .coach-drawer {
      display: none;
      margin-top: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
    }
    .coach-drawer.show { display: block; }
    .coach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #edf4f5;
    }
    .coach-title {
      font-size: 14px;
      font-weight: 950;
      color: var(--navy);
    }
    .coach-badge {
      font-size: 10.5px;
      font-weight: 900;
      background: var(--s);
      color: var(--teal);
      padding: 4px 9px;
      border-radius: 99px;
    }
    .coach-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .coach-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
    }
    .coach-item b {
      font-size: 11px;
      color: var(--navy);
      display: block;
      margin-bottom: 4px;
    }
    .coach-item p {
      margin: 0;
      font-size: 13px;
      color: var(--ink);
    }
    .coach-item.full {
      grid-column: 1 / -1;
      background: #fffdf5;
      border-color: #f7e3af;
    }
    .demo-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .sim-btn {
      background: #fff;
      border: 1.5px solid var(--line);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .sim-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }
    @media(max-width:700px){
      .grid-3, .coach-grid { grid-template-columns: 1fr; }
      .coach-item.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">✚ MEDUS</div>
      <div class="badge">V1.2 MASTERY COACH PREVIEW</div>
    </div>

    <div style="font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 8px;">MÔ PHỎNG DỮ LIỆU HỌC VIÊN:</div>
    <div class="demo-selector">
      <button class="sim-btn active" onclick="loadSim(1)">Học viên 1: Lỗ hổng Safety Gate (Sốt/Sepsis)</button>
      <button class="sim-btn" onclick="loadSim(2)">Học viên 2: Độ chính xác trung bình (60%)</button>
      <button class="sim-btn" onclick="loadSim(3)">Học viên 3: Trắc nghiệm vững (92%)</button>
    </div>

    <div id="demoContent"></div>
  </div>

  <script>
    const scenarios = {
      1: {
        correct: 2, total: 5, pct: 40,
        weak: 'safety_gate', comp: 'Xử trí cấp cứu ban đầu',
        title: 'Ôn tập trọng tâm Section Safety Gate & Sepsis',
        rationale: 'Ghi nhận 3/5 lần bỏ sót tiêu chuẩn sốc nhiễm khuẩn và chỉ định vận mạch. Cần đóng lỗ hổng Safety Gate trước khi tiếp tục.',
        act: 'Learn Section + Targeted QBank (Safety Gate)',
        diff: 'Apply (Nhận diện cốt lõi · 3 câu)',
        caseScore: '1/3'
      },
      2: {
        correct: 6, total: 10, pct: 60,
        weak: 'differential', comp: 'Chẩn đoán phân biệt',
        title: 'Luyện đề củng cố chẩn đoán phân biệt sốt',
        rationale: 'Độ chính xác đạt 60%. Cần tăng cường luyện đề QBank phân tích các nguyên nhân sốt cấp/mạn.',
        act: 'Adaptive QBank Practice',
        diff: 'Apply+ (Phân tích bẫy · 5 câu)',
        caseScore: '2/3'
      },
      3: {
        correct: 11, total: 12, pct: 92,
        weak: null, comp: 'Tư duy lâm sàng toàn diện',
        title: 'Thực chiến với Ca Lâm Sàng 5 bước (Sepsis)',
        rationale: 'Kiến thức trắc nghiệm rất vững (92%). Đề xuất nâng cao độ khó với tình huống ca lâm sàng động.',
        act: 'Interactive Clinical Case',
        diff: 'Evaluate / Create (Tình huống diễn tiến · 1 ca)',
        caseScore: '3/3'
      }
    };

    function loadSim(id) {
      document.querySelectorAll('.sim-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === id));
      const s = scenarios[id];
      const html = `
        <div class="grid-3">
          <div class="card metric">
            <div class="ey">OVERALL ACCURACY</div>
            <strong>${s.pct}%</strong>
            <span class="small">${s.correct}/${s.total} quyết định QBank đúng</span>
            <div class="progress"><i style="width:${s.pct}%"></i></div>
          </div>
          <div class="card metric">
            <div class="ey">STATUS</div>
            <strong>${s.pct >= 85 ? 'Đang vững' : s.pct >= 65 ? 'Đang hình thành' : 'Cần củng cố'}</strong>
            <span class="small">Clinical Problem 02 · Sốt</span>
          </div>
          <div class="card metric">
            <div class="ey">LATEST CASE</div>
            <strong>${s.caseScore}</strong>
            <span class="small">Sepsis Gate · Supabase</span>
          </div>
        </div>

        <div class="rec">
          <div class="ey">NEXT BEST ACTION (DETERMINISTIC COACH)</div>
          <h2>${s.title}</h2>
          <p class="small">${s.rationale}</p>
          <div>
            <a class="btn" href="../hoc/tiep-can-benh-nhan-sot/">Mở bài học CP02</a>
            <a class="btn" href="../qbank/">Luyện Targeted QBank</a>
            <a class="btn" href="../cases/">Thực hành Clinical Case</a>
          </div>

          <div class="rec-coach-box">
            <button class="btn-coach" id="btnCoachDemo" onclick="toggleDrawer()">✦ HỎI AI COACH PHÂN TÍCH LỘ TRÌNH</button>
            <div class="coach-drawer" id="coachDrawerDemo">
              <div class="coach-header">
                <div class="coach-title">✦ MEDUS AI · Mastery Recommendation Model</div>
                <span class="coach-badge">DETERMINISTIC + AI EXPLAIN</span>
              </div>
              <div class="coach-grid">
                <div class="coach-item"><b>CHUYÊN ĐỀ ƯU TIÊN</b><p>Tiếp Cận Bệnh Nhân Sốt (CP #02)</p></div>
                <div class="coach-item"><b>SECTION MỤC TIÊU</b><p>${s.weak || 'Tổng quan & Case'}</p></div>
                <div class="coach-item"><b>HOẠT ĐỘNG KHUYẾN NGHỊ</b><p>${s.act}</p></div>
                <div class="coach-item"><b>ĐỘ KHÓ ĐỀ XUẤT</b><p>${s.diff}</p></div>
                <div class="coach-item full">
                  <b>LÝ DO SƯ PHẠM LÂM SÀNG</b>
                  <p>${s.rationale} Thuật toán Mastery ưu tiên đóng lỗ hổng Safety Gate và Red Flags trước khi chuyển sang các ca lâm sàng phức tạp.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('demoContent').innerHTML = html;
    }

    function toggleDrawer() {
      const d = document.getElementById('coachDrawerDemo');
      const b = document.getElementById('btnCoachDemo');
      if (d.classList.contains('show')) {
        d.classList.remove('show');
        b.innerHTML = '✦ HỎI AI COACH PHÂN TÍCH LỘ TRÌNH';
      } else {
        b.innerHTML = 'Đang phân tích…';
        b.disabled = true;
        setTimeout(() => {
          b.disabled = false;
          b.innerHTML = '▲ ẨN PHÂN TÍCH LỘ TRÌNH';
          d.classList.add('show');
        }, 300);
      }
    }

    loadSim(1);
  </script>
</body>
</html>
