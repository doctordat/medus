<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDUS Cases — Sepsis Gate</title><style>:root{--n:#103e47;--t:#007f89;--l:#dcebed;--m:#667b80;--s:#e9f8f9;--r:#fff0ed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f6fbfc;color:#17343a}a{text-decoration:none;color:inherit}.wrap{max-width:920px;margin:auto;padding:0 22px}nav{height:66px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center}.nav{display:flex;gap:20px;align-items:center}.brand{font-weight:900;color:var(--t);font-size:22px;margin-right:auto}.hero{padding:52px 0 20px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--t)}h1{font-size:44px;letter-spacing:-.04em;margin:10px 0;color:var(--n)}.lead{color:var(--m);line-height:1.65}.case{background:#fff;border:1px solid var(--l);border-radius:22px;padding:28px;margin:20px 0 60px}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.vitals div{background:#f7fafb;border:1px solid var(--l);padding:12px;border-radius:10px;text-align:center;font-size:12px}.prompt{font-size:22px;font-weight:850;line-height:1.45;margin:22px 0 12px}.opts button{width:100%;text-align:left;padding:14px;border:1px solid var(--l);background:#fff;border-radius:11px;margin:7px 0;cursor:pointer}.opts button:hover{border-color:var(--t);background:var(--s)}.feedback{display:none;padding:15px;border-radius:12px;background:var(--s);margin-top:14px;line-height:1.6}.danger{background:var(--r)}.btn{display:inline-block;background:var(--t);color:#fff;padding:13px 17px;border-radius:11px;font-weight:800;border:0;cursor:pointer;margin-top:15px}.done{display:none;text-align:center;padding:24px}.done strong{font-size:52px;color:var(--n);display:block}.small{font-size:12px;color:var(--m)}@media(max-width:680px){.vitals{grid-template-columns:1fr 1fr}h1{font-size:38px}}</style></head><body><nav><div class="wrap nav"><a class="brand" href="../">MEDUS</a><a href="../hoc/tiep-can-benh-nhan-sot/">Learn</a><a href="../qbank/">QBank</a><a href="../mock/">Mock</a></div></nav><main class="wrap"><section class="hero"><div class="ey">MEDUS CASES · INTERACTIVE</div><h1>Sepsis Gate</h1><p class="lead">Một ca bệnh mở dữ kiện theo từng bước. Mục tiêu là chọn ưu tiên đúng trước khi đi sâu vào chẩn đoán.</p></section><section class="case"><div id="stage"></div><div class="done" id="done"><span>Hoàn thành ca</span><strong id="caseScore"></strong><p id="summary"></p><a class="btn" href="../hoc/tiep-can-benh-nhan-sot/#safety">Ôn lại Safety Gate</a> <a class="btn" href="../qbank/">Làm QBank</a></div></section><div class="small">MEDUS Beta · Nội dung phục vụ học tập, không thay thế phác đồ điều trị tại cơ sở.</div></main><script>const steps=[{text:'Nam 68 tuổi, đái tháo đường, sốt 39,2°C và ho đàm 2 ngày. Bệnh nhân lơ mơ, thở nhanh.',v:['HA 86/52','Mạch 124','RR 30','SpO₂ 89%','CRT 4 giây'],q:'Bước ưu tiên đầu tiên?',a:['Cho chụp CT ngực trước','ABCDE, oxy/monitor/đường truyền và đánh giá sốc song song','Hạ sốt rồi đánh giá lại','Chờ cấy máu đủ mới xử trí'],ok:1,fb:'Đây là bệnh nhân có dấu nguy kịch rõ. Ưu tiên ổn định ABCDE và hồi sức ban đầu song song với tìm nguyên nhân.'},{text:'Sau đánh giá ban đầu, nghe phổi có ran đáy phải. Nghi nhiễm trùng phổi kèm giảm tưới máu.',v:['HA còn thấp','Lơ mơ','CRT kéo dài','Ran đáy P','Nghi sepsis'],q:'Cách tiếp cận xét nghiệm và kháng sinh phù hợp nhất?',a:['Lấy cấy máu và lactate nếu không làm trì hoãn kháng sinh, sau đó khởi trị sớm','Đợi kết quả cấy rồi mới dùng kháng sinh','Chỉ làm procalcitonin để quyết định có dùng kháng sinh không','Không cần đánh giá tưới máu thêm'],ok:0,fb:'Cấy và lactate hữu ích nếu không gây trì hoãn. Trong sốc/nhiễm trùng nặng, không chờ đủ kết quả mới khởi trị.'},{text:'Bệnh nhân được truyền dịch tinh thể có đánh giá lại, nhưng huyết áp vẫn thấp và tưới máu chưa cải thiện đủ.',v:['HA vẫn thấp','CRT chậm','Thiểu niệu','Đã bù dịch','Cần reassess'],q:'Bước tiếp theo hợp lý?',a:['Tiếp tục truyền dịch vô hạn','Cân nhắc vận mạch theo phác đồ và đồng thời loại trừ/đánh giá nguyên nhân sốc khác','Ngừng mọi điều trị và chờ','Chỉ tăng thuốc hạ sốt'],ok:1,fb:'Khi sốc không đáp ứng đủ với dịch, cần cân nhắc vận mạch theo phác đồ, đồng thời tái đánh giá quá tải dịch và các nguyên nhân sốc khác.'}];let i=0,s=0;function render(){if(i>=steps.length){stage.style.display='none';done.style.display='block';caseScore.textContent=s+'/'+steps.length;summary.textContent=s===3?'Tốt: mày đã giữ đúng thứ tự ưu tiên — ổn định, điều trị sớm, rồi tái đánh giá đáp ứng.':'Xem lại chuỗi Safety Gate → điều trị sớm → reassessment, vì ca sepsis dễ sai ở việc chờ quá nhiều dữ kiện.';localStorage.setItem('medus_case_sepsis',s);return}let x=steps[i];stage.innerHTML='<div class="ey">STEP '+(i+1)+' / '+steps.length+'</div><h2>'+x.text+'</h2><div class="vitals">'+x.v.map(v=>'<div>'+v+'</div>').join('')+'</div><div class="prompt">'+x.q+'</div><div class="opts">'+x.a.map((a,j)=>'<button onclick="pick('+j+')">'+String.fromCharCode(65+j)+'. '+a+'</button>').join('')+'</div><div class="feedback" id="fb"></div>'}function pick(j){let x=steps[i],f=document.getElementById('fb');f.style.display='block';f.className='feedback'+(j===x.ok?'':' danger');f.innerHTML=(j===x.ok?'<b>Đúng.</b> ':'<b>Chưa đúng.</b> ')+x.fb;if(j===x.ok)s++;document.querySelectorAll('.opts button').forEach(b=>b.disabled=true);setTimeout(()=>{i++;render()},1200)}render();</script></body></html>
